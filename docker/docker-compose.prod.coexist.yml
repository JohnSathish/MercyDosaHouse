# Production Docker Compose — coexists with other apps on the same VPS
# Does NOT bind ports 80/443. Uses localhost-only ports for host nginx reverse proxy.
#
# Usage (from repo root):
#   docker compose --env-file .env -f docker/docker-compose.prod.coexist.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mdh}
    volumes:
      - mdh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mdh} -d ${POSTGRES_DB:-mdh}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - mdh_redis:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mdh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mdh}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '${MDH_API_PORT:-13001}:3001'
    volumes:
      - mdh_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health/ready']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: website
        APP_PORT: 3000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mercydosahouse.com/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mercydosahouse.com}
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-https://mercydosahouse.com}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mercydosahouse.com/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mercydosahouse.com}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-https://mercydosahouse.com}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - '${MDH_WEBSITE_PORT:-13000}:3000'
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: admin
        APP_PORT: 3002
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mercydosahouse.com/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mercydosahouse.com}
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-https://mercydosahouse.com}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://admin.mercydosahouse.com}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mercydosahouse.com/api/v1}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-https://mercydosahouse.com}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://admin.mercydosahouse.com}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - '${MDH_ADMIN_PORT:-13002}:3002'
    depends_on:
      api:
        condition: service_started

volumes:
  mdh_pg:
  mdh_redis:
  mdh_uploads:
