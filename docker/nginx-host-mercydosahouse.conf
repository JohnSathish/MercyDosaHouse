# Mercy Dosa House — host nginx config (add alongside existing sites)
# Install: docker/scripts/install-host-nginx.sh
#
# Ports (localhost, set in .env):
#   MDH_WEBSITE_PORT=13000
#   MDH_API_PORT=13001
#   MDH_ADMIN_PORT=13002

upstream mdh_api {
    server 127.0.0.1:13001;
    keepalive 32;
}

upstream mdh_website {
    server 127.0.0.1:13000;
    keepalive 32;
}

upstream mdh_admin {
    server 127.0.0.1:13002;
    keepalive 32;
}

# ── Website + API (mercydosahouse.com) ───────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name mercydosahouse.com www.mercydosahouse.com;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://mdh_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Prefix without trailing slash so /socket.io and /socket.io/ both hit the API
    # (otherwise Next.js on the website catches it, 308s, and Admin WebSockets fail).
    location ^~ /socket.io {
        proxy_pass http://mdh_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://mdh_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://mdh_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Admin (admin.mercydosahouse.com) ─────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name admin.mercydosahouse.com;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://mdh_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://mdh_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
